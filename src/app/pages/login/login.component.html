<main class="min-h-screen w-full flex flex-col justify-center items-center p-4 md:p-8 bg-[#f8f9ff]">
  <div class="w-full max-w-5xl flex flex-col lg:flex-row shadow-2xl rounded-3xl overflow-hidden bg-white">
    
    <!-- PANEL IZQUIERDO: Branding -->
    <div class="relative w-full lg:w-5/12 bg-gradient-to-br from-[#bb0112] to-red-800 text-white p-8 lg:p-12 flex flex-col justify-between overflow-hidden">
      <div class="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-white/10 blur-3xl pointer-events-none"></div>
      <div class="relative z-10">
        <div class="flex items-center mb-8">
          <img alt="Logo" class="h-12 w-auto object-contain filter drop-shadow-md" src="https://lh3.googleusercontent.com/aida/AEtjO1U3p7wUunUiBr00qZfVp4fgGfI2fpS9MCiDFDR-rrckr0vt6CLSUYva1-lRc4YrGcYpsh5WBTT1IhfPtn0xdOAY5ym4D8vPbh1h1I63Q7I4WH5lfO74HI2OUggYb7sIpp_6zPQjD2KdTbv_qdoyLvcYagg883fRVbFddpuFo-DDKQtHAvG6vW8MHFmBwGdebTur4aWizZ6rQ2mgpgSzujsaYC5qUV9FJBJdnP-g5JiHi0FUElwxb93inGc"/>
        </div>
        <div class="space-y-4">
          <span class="block font-semibold tracking-widest uppercase text-red-100 text-sm">Mesa de Ayuda Corporativa</span>
          <h1 class="text-4xl lg:text-5xl font-bold leading-tight">Gestión de incidencias rápida y clara.</h1>
          <p class="text-red-100/90 text-lg">La plataforma centralizada de soporte interno diseñada para resolver incidencias de manera ágil.</p>
        </div>
      </div>
      <div class="relative z-10 my-8 flex justify-center">
        <img alt="Soporte" class="w-full max-w-sm h-auto object-contain drop-shadow-2xl rounded-2xl" src="https://lh3.googleusercontent.com/aida/AEtjO1X312lWa9M0JyR_1wMW8MlLvwUYoKkwaC7Kcx0BNFp0cZ06LG5BFzxIY0QT2ejzaMRoGskCgJL3ShThOUFqIeY8ZTj6BEuhSvGELpvUAW9IScHKT4W2uyFDMxrvu5QvliYMeo7EJjbG3nCtMYZIetvVWubl62DcKV6pQHg9Bx-qk8qlASMrzYIVCo-gWSKA0JO8Fh7Ce5RFtJ6dziCfPCRX6YpieyX_fOQNyfLkSGj7ZqBi4uU8IyFvELg"/>
      </div>
    </div>

    <!-- PANEL DERECHO: Login -->
    <div class="w-full lg:w-7/12 p-8 md:p-16 flex flex-col justify-center bg-white">
      <div class="max-w-md w-full mx-auto space-y-8">
        <div class="space-y-2">
          <h2 class="text-3xl font-bold tracking-tight text-[#121c2a]">Iniciar sesión en TicketDesk</h2>
          <p class="text-[#584237]">Ingresa tus credenciales corporativas para acceder al panel.</p>
        </div>
        <form class="space-y-6" (submit)="onLogin(); $event.preventDefault()">
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-[#121c2a]">Correo electrónico corporativo</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#584237]">
                <span class="material-symbols-outlined text-xl">mail</span>
              </div>
              <input [(ngModel)]="email" name="email" class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-red-200 focus:border-[#bb0112] transition-all" placeholder="ejemplo@empresa.com" required type="email"/>
            </div>
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-[#121c2a]">Contraseña</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#584237]">
                <span class="material-symbols-outlined text-xl">lock</span>
              </div>
              <input [(ngModel)]="password" name="password" [type]="showPassword ? 'text' : 'password'" class="w-full pl-10 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-red-200 focus:border-[#bb0112] transition-all" placeholder="••••••••" required/>
              <button (click)="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-[#584237] hover:text-[#121c2a] transition-colors" type="button">
                <span class="material-symbols-outlined text-xl">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
              </button>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer">
              <input [(ngModel)]="rememberMe" name="remember" class="w-4 h-4 accent-[#bb0112] cursor-pointer" type="checkbox"/>
              <span class="text-sm text-[#584237]">Recordarme</span>
            </label>
            <a class="text-sm font-semibold text-[#bb0112] hover:underline" href="#recuperar">¿Olvidaste tu contraseña?</a>
          </div>
          <button [disabled]="isLoading" class="w-full py-3.5 rounded-xl bg-[#bb0112] hover:bg-red-700 text-white font-bold shadow-lg transition-all flex items-center justify-center gap-2 active:scale-[0.98] disabled:bg-red-400" type="submit">
            <span *ngIf="!isLoading">Iniciar sesión</span>
            <span *ngIf="isLoading" class="animate-pulse">Validando...</span>
            <span *ngIf="!isLoading" class="material-symbols-outlined">arrow_forward</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</main>
